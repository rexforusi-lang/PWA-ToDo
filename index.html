<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Todo Calendar PWA</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"><script src="https://accounts.google.com/gsi/client" async defer></script></head><body>
<div class="app-shell"><header class="topbar"><div><p class="eyebrow">Todo Calendar PWA</p><h1>任務與行事曆</h1></div><button id="installBtn" class="ghost hidden" type="button">安裝 App</button></header>
<nav class="tabs"><button class="tab active" data-page="tasks" type="button">任務</button><button class="tab" data-page="calendar" type="button">月曆</button><button class="tab" data-page="settings" type="button">設定</button></nav>
<main><section id="tasksPage" class="page active"><div class="toolbar"><div><h2>Checklist</h2><p id="syncStatus" class="muted">本機資料已就緒</p></div><button id="openCreateModal" class="primary" type="button">＋ 新增事件</button></div><div class="filters"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="today">今日</button><button class="chip" data-filter="upcoming">未來</button><button class="chip" data-filter="completed">完成</button></div><ul id="taskList" class="task-list"></ul><div id="emptyState" class="empty hidden">目前沒有任務，點擊「新增事件」開始。</div></section>
<section id="calendarPage" class="page"><div class="calendar-header"><button id="prevMonth" class="ghost" type="button">‹ 上個月</button><div class="calendar-title-group"><h2 id="calendarTitle"></h2><button id="todayBtn" class="ghost compact" type="button">回到今日</button></div><button id="nextMonth" class="ghost" type="button">下個月 ›</button></div><div class="calendar-wrap" id="calendarSwipeArea"><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendarGrid" class="calendar-grid"></div></div></section>
<section id="settingsPage" class="page"><h2>設定</h2><div class="settings-card"><h3>Google Drive 同步</h3><p class="muted">可輸入 Google Drive 資料夾連結；未授權時使用模擬同步。</p><label>Google OAuth Client ID<input id="googleClientId" type="text" placeholder="xxxxx.apps.googleusercontent.com"></label><label>Google Drive 資料夾連結或 Folder ID<input id="driveFolder" type="text" placeholder="https://drive.google.com/drive/folders/..."></label><div class="button-row"><button id="saveSettings" class="primary">儲存設定</button><button id="googleSignIn" class="ghost">Google 授權</button><button id="syncNow" class="ghost">立即同步</button></div><p id="driveStatus" class="muted"></p></div>
<div class="settings-card"><h3>通知權限狀態</h3><p class="muted">提醒設定已移到事件新增 / 編輯頁面。儲存有提醒的事件時會要求通知權限。</p><span id="notificationStatus" class="badge"></span></div>
<div class="settings-card"><h3>程式更新</h3><div class="version-grid"><div><span class="muted">Current Version</span><strong id="currentVersion">1.0.1</strong></div><div><span class="muted">Latest Version</span><strong id="latestVersion">檢查中...</strong></div></div><p id="updateNotes" class="muted status-line">尚未檢查更新</p><div class="button-row"><button id="checkUpdate" class="ghost">檢查更新</button><button id="applyUpdate" class="primary hidden">套用更新</button></div></div></section></main></div>
<dialog id="taskModal" class="modal"><form id="taskForm" method="dialog"><div class="modal-header"><h2 id="modalTitle">新增事件</h2><button id="closeModal" class="icon-btn" type="button">×</button></div><input id="taskId" type="hidden"><label>標題<input id="taskTitle" type="text" required maxlength="80" placeholder="輸入任務標題"></label><label>內容<textarea id="taskBody" rows="4" placeholder="任務內容或備註"></textarea></label><div class="datetime-grid"><label>事件日期<input id="taskDate" type="date" required></label><label>事件時間<input id="taskTime" type="time" required step="300"></label></div><label>通知提醒<select id="taskNotifyBefore"><option value="none">不提醒</option><option value="5">提前 5 分鐘</option><option value="10">提前 10 分鐘</option><option value="30">提前 30 分鐘</option><option value="60">提前 1 小時</option><option value="1440">提前 1 天</option></select></label><div class="modal-actions"><button id="deleteInModal" class="danger hidden" type="button">刪除</button><span class="spacer"></span><button class="ghost" type="button" id="cancelModal">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog>
<template id="taskTemplate"><li class="task-row"><div class="swipe-content"><input class="task-check" type="checkbox"><div class="task-main"><strong class="task-title"></strong><p class="task-body"></p><time class="task-time"></time></div><div class="desktop-actions"><button class="edit-btn ghost" type="button">編輯</button><button class="delete-btn danger" type="button">刪除</button></div></div><button class="swipe-delete danger" type="button">刪除</button></li></template><script src="./app.js"></script></body></html>
